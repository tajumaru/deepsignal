<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="DeepSignal — Walrus Feedback Lab for encrypted Walrus-native forms and submissions."
    />
    <title>DeepSignal — Walrus Feedback Lab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/deepsignal-mark.svg" />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background:
          radial-gradient(circle at top, rgba(49, 130, 206, 0.22), transparent 35%),
          radial-gradient(circle at 20% 80%, rgba(19, 78, 74, 0.45), transparent 30%),
          linear-gradient(180deg, #06111d 0%, #081726 45%, #04101b 100%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        background:
          radial-gradient(circle at top, rgba(49, 130, 206, 0.22), transparent 35%),
          radial-gradient(circle at 20% 80%, rgba(19, 78, 74, 0.45), transparent 30%),
          linear-gradient(180deg, #06111d 0%, #081726 45%, #04101b 100%);
        color: #ecfdff;
      }

      body {
        overflow-x: hidden;
      }

      body.booting {
        overflow: hidden;
      }

      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding:
          max(1.25rem, env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right))
          max(1.25rem, env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
        background:
          radial-gradient(circle at top, rgba(49, 130, 206, 0.2), transparent 36%),
          linear-gradient(180deg, #06111d 0%, #04101b 100%);
        transition: opacity 380ms ease, visibility 380ms ease;
      }

      #boot-overlay[data-state="exiting"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-shell {
        display: grid;
        justify-items: center;
        gap: 0.9rem;
        width: min(100%, 22rem);
        color: #ecfdff;
        text-align: center;
      }

      .boot-mark {
        display: grid;
        width: 3rem;
        height: 3rem;
        place-items: center;
        border: 1px solid rgba(116, 226, 255, 0.36);
        border-radius: 16px;
        background: rgba(10, 28, 43, 0.72);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      }

      .boot-spinner {
        width: 1.35rem;
        height: 1.35rem;
        border: 2px solid rgba(141, 226, 255, 0.22);
        border-top-color: #8adfff;
        border-radius: 999px;
        animation: bootSpin 900ms linear infinite;
      }

      .boot-title {
        margin: 0;
        font-size: clamp(1.8rem, 10vw, 2.45rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .boot-status {
        margin: 0;
        color: #a8d3e4;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      @keyframes bootSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-overlay {
          transition-duration: 1ms;
        }

        .boot-spinner {
          animation: none;
          border-color: rgba(141, 226, 255, 0.34);
          box-shadow: 0 0 14px rgba(102, 227, 255, 0.24);
        }
      }
    </style>
    <script>
      (() => {
        const maxAttempts = 6;
        const baseDelayMs = 900;

        function retryStylesheet(link) {
          const attempts = Number(link.dataset.deepsignalCssRetries || "0");
          if (attempts >= maxAttempts) {
            return;
          }

          const nextAttempt = attempts + 1;
          link.dataset.deepsignalCssRetries = String(nextAttempt);
          const href = new URL(link.href, window.location.href);
          href.searchParams.set("css-retry", String(Date.now()));

          window.setTimeout(() => {
            link.href = href.toString();
          }, baseDelayMs * nextAttempt);
        }

        document.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            if (target instanceof HTMLLinkElement && target.rel === "stylesheet") {
              retryStylesheet(target);
            }
          },
          true,
        );
      })();
    </script>
  </head>
  <body class="booting">
    <div id="boot-overlay" aria-live="polite">
      <section class="boot-shell" role="status" aria-label="DeepSignal initialization">
        <div class="boot-mark" aria-hidden="true">
          <div class="boot-spinner"></div>
        </div>
        <h1 class="boot-title">DeepSignal</h1>
        <p class="boot-status" data-boot-status>Loading encrypted signal workspace...</p>
      </section>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        window.__DEEPSIGNAL_BOOT_STARTED_AT__ = performance.now();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="DeepSignal — Walrus Feedback Lab for encrypted Walrus-native forms and submissions."
    />
    <title>DeepSignal — Walrus Feedback Lab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/deepsignal-mark.svg" />
    <link
      rel="preload"
      as="image"
      href="/deepsignal-mascot-ui.webp"
      type="image/webp"
      imagesrcset="/deepsignal-mascot-ui.webp 1x, /deepsignal-mascot-ui@2x.webp 2x"
    />
    <link rel="preload" as="image" href="/mascot/deepsignal-frog/peek.webp" type="image/webp" />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background-color: #04101b;
        background-image:
          radial-gradient(circle at top, rgba(49, 130, 206, 0.22), transparent 35%),
          radial-gradient(circle at 20% 80%, rgba(19, 78, 74, 0.45), transparent 30%),
          linear-gradient(180deg, #06111d 0%, #081726 45%, #04101b 100%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #04101b;
        background-image:
          radial-gradient(circle at top, rgba(49, 130, 206, 0.22), transparent 35%),
          radial-gradient(circle at 20% 80%, rgba(19, 78, 74, 0.45), transparent 30%),
          linear-gradient(180deg, #06111d 0%, #081726 45%, #04101b 100%);
        color: #ecfdff;
        overscroll-behavior-y: none;
      }

      body {
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-color: #04101b;
        background-image:
          radial-gradient(circle at top, rgba(49, 130, 206, 0.22), transparent 35%),
          radial-gradient(circle at 20% 80%, rgba(19, 78, 74, 0.45), transparent 30%),
          linear-gradient(180deg, #06111d 0%, #081726 45%, #04101b 100%);
        transform: translateZ(0);
      }

      body.booting {
        overflow: hidden;
      }

      #root {
        position: relative;
        min-height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #04101b;
        background-image:
          radial-gradient(circle at top, rgba(49, 130, 206, 0.22), transparent 35%),
          radial-gradient(circle at 20% 80%, rgba(19, 78, 74, 0.45), transparent 30%),
          linear-gradient(180deg, #06111d 0%, #081726 45%, #04101b 100%);
        isolation: isolate;
      }

      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding:
          max(1.25rem, env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right))
          max(1.25rem, env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
        background:
          radial-gradient(circle at top, rgba(49, 130, 206, 0.2), transparent 36%),
          linear-gradient(180deg, #06111d 0%, #04101b 100%);
        transition: opacity 380ms ease, visibility 380ms ease;
      }

      #boot-overlay[data-state="exiting"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-shell {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 0.58rem;
        width: min(100%, 34rem);
        color: #ecfdff;
        text-align: center;
      }

      .boot-mark {
        position: relative;
        z-index: 2;
        display: grid;
        width: 3rem;
        height: 3rem;
        place-items: center;
        border: 0;
        background: transparent;
      }

      .boot-eyebrow {
        margin: 0;
        color: #7fe8ff;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .boot-signal {
        position: relative;
        width: 3rem;
        height: 3rem;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.3));
      }

      .boot-signal::before {
        content: "";
        position: absolute;
        inset: 0.24rem 0.18rem 0.1rem;
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 62%, rgba(35, 227, 229, 0.96) 0 38%, rgba(7, 122, 142, 0.82) 78%),
          linear-gradient(180deg, rgba(125, 239, 255, 0.32), rgba(6, 18, 29, 0.24));
        box-shadow:
          inset 0 0 0 1px rgba(236, 253, 255, 0.1),
          0 0 18px rgba(125, 239, 255, 0.2);
      }

      .boot-watcher-hat {
        position: absolute;
        left: 0.47rem;
        right: 0.47rem;
        top: 0.64rem;
        height: 0.7rem;
        z-index: 2;
        border-radius: 0.8rem 0.8rem 0.32rem 0.32rem;
        background:
          repeating-linear-gradient(90deg, transparent 0 0.23rem, rgba(111, 48, 8, 0.23) 0.23rem 0.29rem),
          linear-gradient(180deg, #ff9c1a 0%, #ff7900 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 222, 126, 0.35),
          0 2px 8px rgba(255, 122, 0, 0.2);
      }

      .boot-watcher-monitor {
        position: absolute;
        left: 50%;
        top: 0.04rem;
        z-index: 3;
        width: 1.34rem;
        height: 0.94rem;
        transform: translateX(-50%);
        border: 1px solid rgba(116, 226, 255, 0.34);
        border-radius: 0.34rem;
        background:
          radial-gradient(circle at 50% 54%, rgba(125, 239, 255, 0.22), transparent 42%),
          linear-gradient(180deg, #203647 0%, #0e1d2c 100%);
        box-shadow:
          inset 0 0 0 1px rgba(236, 253, 255, 0.05),
          0 0 10px rgba(125, 239, 255, 0.14);
      }

      .boot-watcher-monitor::before,
      .boot-watcher-monitor::after {
        content: "";
        position: absolute;
        top: -0.36rem;
        width: 0.38rem;
        height: 0.38rem;
        border-radius: 999px;
        background: #24394b;
        box-shadow: inset 0 0 0 1px rgba(116, 226, 255, 0.28);
      }

      .boot-watcher-monitor::before {
        left: 0.1rem;
      }

      .boot-watcher-monitor::after {
        right: 0.1rem;
      }

      .boot-watcher-core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0.48rem;
        height: 0.48rem;
        transform: translate(-50%, -50%);
        border-radius: 999px;
        background:
          radial-gradient(circle, #8df7ff 0 24%, rgba(141, 247, 255, 0.2) 27% 54%, transparent 56%),
          radial-gradient(circle, rgba(69, 245, 190, 0.3), transparent 64%);
        box-shadow: 0 0 12px rgba(125, 239, 255, 0.4);
      }

      .boot-watcher-eye {
        position: absolute;
        left: 50%;
        top: 1.82rem;
        z-index: 4;
        width: 1.08rem;
        height: 1.08rem;
        overflow: hidden;
        transform: translate(-50%, -50%);
        border-radius: 999px;
        background: #fff2d8;
        box-shadow:
          0 0 0 1px rgba(4, 16, 27, 0.36),
          0 0 16px rgba(125, 239, 255, 0.28);
      }

      .boot-watcher-eye::before {
        content: "";
        position: absolute;
        inset: -0.16rem;
        border: 2px solid rgba(127, 232, 255, 0.42);
        border-radius: inherit;
        animation: boot-watcher-rim 5.8s ease-in-out infinite;
      }

      .boot-watcher-pupil {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0.52rem;
        height: 0.52rem;
        transform: translate(-50%, -50%);
        border-radius: 999px;
        background:
          radial-gradient(circle at 35% 28%, #ddfdff 0 10%, transparent 11%),
          radial-gradient(circle at 50% 50%, #0b1828 0 58%, #10283b 60% 100%);
        animation: boot-watcher-look 5.8s ease-in-out infinite;
      }

      .boot-watcher-lid {
        position: absolute;
        inset: -1px;
        transform: scaleY(0);
        transform-origin: top;
        border-radius: inherit;
        background: linear-gradient(180deg, #12d7df 0%, #0ba9bc 100%);
        animation: boot-watcher-blink 7.2s ease-in-out infinite;
      }

      .boot-watcher-mouth {
        position: absolute;
        left: 50%;
        bottom: 0.24rem;
        z-index: 4;
        width: 0.25rem;
        height: 1px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgba(4, 24, 34, 0.64);
      }

      .boot-title {
        margin: 0;
        max-width: 34rem;
        font-size: clamp(1.9rem, 6.3vw, 3.35rem);
        line-height: 1.02;
        letter-spacing: 0;
      }

      .boot-status {
        margin: 0;
        color: #a8d3e4;
        max-width: 28rem;
        font-size: clamp(0.98rem, 2.5vw, 1.08rem);
        line-height: 1.5;
      }

      .boot-diagnostic {
        display: none;
        margin: 0;
        color: rgba(168, 211, 228, 0.76);
        font-size: 0.84rem;
        line-height: 1.4;
      }

      .boot-diagnostic:not(:empty) {
        display: block;
      }

      .boot-pipeline {
        position: relative;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        align-items: start;
        width: min(100%, 25rem);
        min-width: 0;
        margin: 0.15rem 0 0.1rem;
        padding-top: 0.1rem;
      }

      .boot-pipeline::before {
        content: "";
        position: absolute;
        top: 0.62rem;
        right: 12.5%;
        left: 12.5%;
        height: 1px;
        background:
          linear-gradient(90deg, rgba(127, 232, 255, 0.1), rgba(127, 232, 255, 0.72), rgba(56, 245, 181, 0.3));
        box-shadow: 0 0 14px rgba(127, 232, 255, 0.34);
      }

      .boot-pipeline-node {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 0.45rem;
        min-width: 0;
        color: #a8d3e4;
        font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 0.68rem;
        line-height: 1.25;
        text-transform: uppercase;
      }

      .boot-pipeline-node::before {
        content: "";
        position: relative;
        z-index: 1;
        width: 0.74rem;
        height: 0.74rem;
        border: 1px solid rgba(127, 232, 255, 0.72);
        border-radius: 999px;
        background:
          radial-gradient(circle, #8df7ff 0 26%, rgba(5, 18, 30, 0.95) 32% 100%);
        box-shadow:
          0 0 0 4px rgba(127, 232, 255, 0.07),
          0 0 18px rgba(127, 232, 255, 0.28);
        animation: boot-node-pulse 2.8s ease-in-out infinite;
      }

      .boot-particle {
        position: absolute;
        top: 0.39rem;
        left: 12.5%;
        z-index: 2;
        width: 0.48rem;
        height: 0.48rem;
        margin-left: -0.24rem;
        border-radius: 999px;
        background: #8df7ff;
        box-shadow:
          0 0 10px rgba(141, 247, 255, 0.95),
          0 0 24px rgba(56, 245, 181, 0.42);
        animation: boot-particle 2.7s cubic-bezier(0.45, 0, 0.25, 1) infinite;
        will-change: left, transform, opacity;
      }

      .boot-steps {
        display: grid;
        gap: 0.45rem;
        width: min(100%, 25rem);
        min-width: 0;
        margin: 0.2rem 0 0;
        padding: 0.85rem;
        border: 1px solid rgba(168, 230, 255, 0.18);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(10, 28, 43, 0.78), rgba(5, 18, 30, 0.72));
        box-shadow:
          inset 0 1px 0 rgba(236, 253, 255, 0.04),
          0 24px 70px rgba(0, 0, 0, 0.2);
        list-style: none;
        text-align: left;
      }

      .boot-steps li {
        display: grid;
        grid-template-columns: 1.25rem 1fr;
        align-items: center;
        gap: 0.65rem;
        color: #b8dcea;
        font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 0.82rem;
        line-height: 1.35;
      }

      .boot-steps li::before {
        color: #38f5b5;
        content: "\2713";
      }

      .boot-steps li.is-active {
        color: #ecfdff;
        animation: boot-active-step 1.6s ease-in-out infinite;
      }

      .boot-steps li.is-active::before {
        content: "\2192";
        color: #7fe8ff;
        animation: boot-cursor 1s steps(2, end) infinite;
      }

      .boot-progress {
        position: relative;
        width: min(100%, 25rem);
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(168, 230, 255, 0.14);
      }

      .boot-progress::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 46%;
        background: linear-gradient(90deg, transparent, #7fe8ff, #38f5b5);
        animation: boot-progress 1.7s ease-in-out infinite;
      }

      .boot-version {
        position: fixed;
        right: max(1rem, env(safe-area-inset-right));
        bottom: max(0.85rem, env(safe-area-inset-bottom));
        margin: 0;
        color: rgba(168, 211, 228, 0.68);
        font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 0.72rem;
        line-height: 1.45;
        text-align: right;
        white-space: pre-line;
      }

      .boot-version[hidden] {
        display: none;
      }

      @keyframes boot-node-pulse {
        0%, 100% { opacity: 0.74; transform: scale(0.92); }
        48% { opacity: 1; transform: scale(1.08); }
      }

      @keyframes boot-particle {
        0% { opacity: 0; left: 12.5%; transform: scale(0.75); }
        12%, 88% { opacity: 1; }
        100% { opacity: 0; left: 87.5%; transform: scale(0.75); }
      }

      @keyframes boot-progress {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(240%); }
      }

      @keyframes boot-active-step {
        0%, 100% { text-shadow: 0 0 0 rgba(127, 232, 255, 0); }
        50% { text-shadow: 0 0 12px rgba(127, 232, 255, 0.42); }
      }

      @keyframes boot-cursor {
        50% { opacity: 0.35; }
      }

      @keyframes boot-watcher-look {
        0%, 24%, 100% { transform: translate(-50%, -50%); }
        38%, 50% { transform: translate(-68%, -50%); }
        68%, 82% { transform: translate(-32%, -50%); }
      }

      @keyframes boot-watcher-blink {
        0%, 71%, 75%, 100% { transform: scaleY(0); }
        72.4%, 73.2% { transform: scaleY(1); }
      }

      @keyframes boot-watcher-rim {
        0%, 100% { opacity: 0.46; }
        50% { opacity: 0.78; }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-overlay,
        .boot-watcher-eye::before,
        .boot-watcher-pupil,
        .boot-watcher-lid,
        .boot-pipeline-node::before,
        .boot-particle,
        .boot-progress::before,
        .boot-steps li.is-active,
        .boot-steps li.is-active::before {
          animation: none;
          transition-duration: 1ms;
        }

        .boot-particle {
          opacity: 1;
          left: 50%;
          transform: scale(0.9);
        }

      }

      @media (max-width: 720px) {
        .boot-shell {
          gap: 0.48rem;
        }

        .boot-title {
          font-size: clamp(1.75rem, 9vw, 2.45rem);
        }

        .boot-pipeline,
        .boot-steps,
        .boot-progress {
          width: min(100%, 21.4rem);
        }

        .boot-pipeline-node {
          font-size: 0.58rem;
        }

        .boot-version {
          right: 50%;
          transform: translateX(50%);
          width: max-content;
          max-width: calc(100vw - 2rem);
          text-align: center;
        }

      }
    </style>
    <script>
      (() => {
        const maxAttempts = 6;
        const baseDelayMs = 900;

        function retryStylesheet(link) {
          const attempts = Number(link.dataset.deepsignalCssRetries || "0");
          if (attempts >= maxAttempts) {
            return;
          }

          const nextAttempt = attempts + 1;
          link.dataset.deepsignalCssRetries = String(nextAttempt);
          const href = new URL(link.href, window.location.href);
          href.searchParams.set("css-retry", String(Date.now()));

          window.setTimeout(() => {
            link.href = href.toString();
          }, baseDelayMs * nextAttempt);
        }

        document.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            if (target instanceof HTMLLinkElement && target.rel === "stylesheet") {
              retryStylesheet(target);
            }
          },
          true,
        );
      })();
    </script>
  </head>
  <body class="booting">
    <div id="boot-overlay" aria-live="polite">
      <section class="boot-shell" role="status" aria-label="DeepSignal initialization">
        <div class="boot-mark" aria-hidden="true">
          <div class="boot-signal">
            <span class="boot-watcher-monitor">
              <span class="boot-watcher-core"></span>
            </span>
            <span class="boot-watcher-hat"></span>
            <span class="boot-watcher-eye">
              <span class="boot-watcher-pupil"></span>
              <span class="boot-watcher-lid"></span>
            </span>
            <span class="boot-watcher-mouth"></span>
          </div>
        </div>
        <p class="boot-eyebrow">DeepSignal secure boot</p>
        <h1 class="boot-title">Initializing Secure Signal Pipeline</h1>
        <p class="boot-status">Preparing encrypted inbox infrastructure...</p>
        <p class="boot-diagnostic" data-boot-status></p>
        <div class="boot-pipeline" aria-label="Incoming Signal to encrypted inbox pipeline">
          <span class="boot-particle" aria-hidden="true"></span>
          <span class="boot-pipeline-node">Incoming Signal</span>
          <span class="boot-pipeline-node">Encrypt</span>
          <span class="boot-pipeline-node">Store</span>
          <span class="boot-pipeline-node">Inbox</span>
        </div>
        <div class="boot-progress" aria-hidden="true"></div>
        <ol class="boot-steps" aria-label="Initialization sequence">
          <li>Receiving signal stream</li>
          <li>Sealing private payloads</li>
          <li>Preserving evidence</li>
          <li>Preparing encrypted inbox</li>
          <li class="is-active">Ready to review</li>
        </ol>
      </section>
      <p class="boot-version" data-boot-version hidden></p>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        window.__DEEPSIGNAL_BOOT_STARTED_AT__ = performance.now();

        const versionTarget = document.querySelector("[data-boot-version]");
        if (!versionTarget) {
          return;
        }

        function setBootVersion(manifest) {
          const version = typeof manifest?.appVersion === "string" ? manifest.appVersion.trim() : "";
          const buildTime = typeof manifest?.buildTime === "string" ? manifest.buildTime.trim() : "";
          if (!version && !buildTime) {
            return;
          }

          versionTarget.textContent = [version ? `v${version}` : "", buildTime].filter(Boolean).join("\n");
          versionTarget.hidden = false;
        }

        fetch(new URL("./version.json", window.location.href).toString(), { cache: "no-store" })
          .then((response) => (response.ok ? response.json() : null))
          .then((manifest) => {
            if (manifest) {
              setBootVersion(manifest);
            }
          })
          .catch(() => undefined);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

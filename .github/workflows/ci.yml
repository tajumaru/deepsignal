name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: test / check / build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run checks
        run: npm run check

      - name: Build
        run: npm run build
